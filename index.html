<!DOCTYPE html>
<html lang="pt-br">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    
    <header>
      <h1>Loja Simples</h1>
      <p>Cadastro de Produtos</p>
    </header>

    <main>
      
      <section class="formulario">
        <h2>Cadastrar produto</h2>

        <form id="formularioBatata">

          <div class="campo">
          <label for="nome">Nome do Produto:</label>
          <input
            type="text"
            id="nome"
            placeholder="Ex: Caderno"
            required
          >
        </div>

           <div class="campo">
          <label for="preco">Preço:</label>
          <input
            type="number"
            id="preco"
            step="0.01"
            min="0"
            placeholder="Ex: 12.50"
            required
          >
           </div>

          <div class="campo">
          <label for="quantidade">Quantidade:</label>
          <input
            type="number"
            id="quantidade"
            min="1"
            placeholder="Ex: 10"
            required
          >
          </div>

          
          <p id="mensagemErro" ></p>

          <button type="submit" id="botao-formulario">
            Adicionar produto
          </button>
          
        </form>
      </section>

      <section class="produtos">
        
        <div class="titulo-lista">
          <h2>Produtos cadastrados</h2>
          
          <p id="contadorBatata">
            Produtos Cadastrados: 0
          </p>
        </div>

        <p id="listaVazia">
          Nenhum produto cadastrado.
        </p>

        <ul id="listaProdutos">
        </ul>
        
      </section>
      
    </main>

    <footer>
      <p>Loja Simples - fundamentos web.</p>
    </footer>

    <script src="script.js"></script>
    
  </body>
  
</html>
