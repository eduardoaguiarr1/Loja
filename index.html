<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="batata-header">
      <h1>Loja Simples</h1>
      <p>Controle de produtos - Fundamentos Web</p>
    </header>

    <main>
      <section class="cartao" id="batata-form">
        <h2>Novo produto</h2>

        <form id="form-produto">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex: Caderno"
            required
          />

          <label for="preco">Preço (R$)</label>
          <input
            type="number"
            id="preco"
            name="preco"
            step="0.01"
            min="0"
            placeholder="Ex: 12.50"
            required
          />

          <label for="quantidade">Quantidade</label>
          <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="0"
            placeholder="Ex: 10"
            required
          />

          <p id="mensagem-erro" class="mensagem-erro"></p>

          <button type="submit" id="botao-formulario">
            Adicionar produto
          </button>
        </form>
      </section>

      <section class="cartao" id="batata-lista">
        <div class="titulo-lista">
          <h2>Produtos cadastrados</h2>
          <p id="contador-produtos">Produtos cadastrados: 0</p>
        </div>

        <p id="lista-vazia" class="lista-vazia">Nenhum produto cadastrado.</p>

        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <footer id="batata-footer">
      <p>Loja Simples</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
